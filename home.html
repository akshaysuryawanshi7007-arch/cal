<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculator {
            background: #222;
            padding: 20px;
            border-radius: 15px;
            width: 300px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        h2 {
            color: white;
            text-align: center;
        }

        #display {
            width: 100%;
            height: 60px;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-size: 28px;
            text-align: right;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #eee;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #444;

        }

        button:hover {
            background: #666;
        }

        .operator {
            background: #ff9800;
        }

        .operator:hover {
            background: #e68900;
        }

        .clear {
            background: #f44336;
        }

        .equal {
            background: #4caf50;
        }
    </style>
</head>
